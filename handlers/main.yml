---
- name: Reboot system
  ansible.builtin.reboot:
    msg: "Rebooting system to apply changes..."
    connect_timeout: 10
    reboot_timeout: 1200
  become: true
  when:
    - upgrade_reboot
    - upgrade_reboot_required | default(false)
    - upgrade_reboot_confirmed | default(true)
    - ansible_os_family != "Windows"

- name: Reboot system
  ansible.windows.win_reboot:
    msg: "Rebooting system to apply changes..."
    connect_timeout: 10
    reboot_timeout: 1200
  when:
    - upgrade_reboot
    - upgrade_reboot_required | default(false)
    - upgrade_reboot_confirmed | default(true)
    - ansible_os_family == "Windows"
