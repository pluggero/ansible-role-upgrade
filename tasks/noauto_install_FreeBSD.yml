---
- name: Ensure we are using pkgng
  ansible.builtin.fail:
    msg: "This role only supports {{ ansible_os_family }} systems that use pkgng as a package manager."
  when: ansible_pkg_mgr != "pkgng"

- name: Install upgrade via pkgng
  community.general.pkgng:
    name: "*"
    state: latest
  become: true

# pkg upgrade never touches the running kernel on FreeBSD (kernel upgrades are
# handled separately via freebsd-update), so there is no reboot-required
# signal to derive from a pkg upgrade here.
- name: Set reboot-required fact (FreeBSD - not applicable to pkg upgrades)
  ansible.builtin.set_fact:
    upgrade_reboot_required: false
