---
- name: Reboot system (local connection)
  ansible.builtin.command: reboot
  become: true
  async: 1
  poll: 0
  failed_when: false
  when:
    - upgrade_reboot
    - upgrade_reboot_required | default(false)
    - upgrade_reboot_confirmed | default(true)
    - ansible_os_family != "Windows"
    - ansible_connection == "local"

- name: Reboot system
  ansible.builtin.reboot:
    msg: "Rebooting system to apply changes..."
    connect_timeout: 10
    reboot_timeout: 1200
  become: true
  when:
    - upgrade_reboot
    - upgrade_reboot_required | default(false)
    - upgrade_reboot_confirmed | default(true)
    - ansible_os_family != "Windows"
    - ansible_connection != "local"

# Outsourced to avoid resolving ansible.windows on non-Windows hosts.
- name: Reboot system (Windows)
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/noauto_reboot_Windows.yml"
  when:
    - upgrade_reboot
    - upgrade_reboot_required | default(false)
    - upgrade_reboot_confirmed | default(true)
    - ansible_os_family == "Windows"
