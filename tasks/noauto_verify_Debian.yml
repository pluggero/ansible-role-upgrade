---
- name: Check if any packages need upgrading
  ansible.builtin.apt:
    upgrade: dist
    update_cache: false
  check_mode: true
  register: apt_upgrade_check
  become: true

- name: Set fact for packages needing upgrade
  ansible.builtin.set_fact:
    packages_needed_upgrade: "{{ apt_upgrade_check.changed | default(false) }}"

- name: Parse last upgrade timestamp from apt history
  ansible.builtin.shell: |
    set -o pipefail
    grep "^Start-Date:" /var/log/apt/history.log | tail -1 | sed 's/Start-Date: //'
  args:
    executable: /bin/bash
  register: upgrade_apt_last_start
  changed_when: false
  when: packages_needed_upgrade

- name: Get current time and last upgrade time in epoch
  ansible.builtin.shell: |
    echo "$(date +%s) $(date -d "{{ upgrade_apt_last_start.stdout }}" +%s)"
  register: upgrade_apt_times
  changed_when: false
  when:
    - packages_needed_upgrade
    - upgrade_apt_last_start.stdout | length > 0

- name: Calculate time since last upgrade
  ansible.builtin.set_fact:
    upgrade_apt_seconds_ago: "{{ (upgrade_apt_times.stdout.split()[0] | int) - (upgrade_apt_times.stdout.split()[1] | int) }}"
  when:
    - packages_needed_upgrade
    - upgrade_apt_times.stdout is defined

- name: Assert upgrade ran within last 5 minutes
  ansible.builtin.assert:
    that:
      - upgrade_apt_last_start.stdout | length > 0
      - upgrade_apt_seconds_ago | int < 300
    fail_msg: "Last apt upgrade was {{ (upgrade_apt_seconds_ago | int / 60) | round(1) }} minutes ago (expected less than 5 minutes)"
  when: packages_needed_upgrade

- name: Report system already up-to-date
  ansible.builtin.debug:
    msg: "System is already up-to-date, skipping timestamp verification"
  when: not packages_needed_upgrade

- name: Check for broken packages
  ansible.builtin.command: dpkg --audit
  register: dpkg_audit
  changed_when: false

- name: Assert no broken packages
  ansible.builtin.assert:
    that:
      - dpkg_audit.stdout == ""
    fail_msg: "Found broken packages: {{ dpkg_audit.stdout }}"

- name: Gather package facts for unattended-upgrades check
  ansible.builtin.package_facts:
    manager: auto

- name: Assert unattended-upgrades is installed
  ansible.builtin.assert:
    that:
      - "'unattended-upgrades' in ansible_facts.packages"
    fail_msg: "unattended-upgrades package was not installed"

- name: Read rendered 50unattended-upgrades config
  ansible.builtin.slurp:
    src: /etc/apt/apt.conf.d/50unattended-upgrades
  register: upgrade_unattended_policy_file

- name: Assert 50unattended-upgrades contains expected directives
  ansible.builtin.assert:
    that:
      - "'-security\";' in (upgrade_unattended_policy_file.content | b64decode)"
      - "'Unattended-Upgrade::Automatic-Reboot \"true\";' in (upgrade_unattended_policy_file.content | b64decode)"
      - "'Unattended-Upgrade::Automatic-Reboot-Time \"02:00\";' in (upgrade_unattended_policy_file.content | b64decode)"
    fail_msg: "50unattended-upgrades is missing expected directives"

- name: Read rendered 20auto-upgrades config
  ansible.builtin.slurp:
    src: /etc/apt/apt.conf.d/20auto-upgrades
  register: upgrade_unattended_periodic_file

- name: Assert 20auto-upgrades enables periodic unattended-upgrade
  ansible.builtin.assert:
    that:
      - "'APT::Periodic::Unattended-Upgrade \"1\";' in (upgrade_unattended_periodic_file.content | b64decode)"
    fail_msg: "20auto-upgrades does not enable APT::Periodic::Unattended-Upgrade"

- name: Check apt-daily-upgrade timer state
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
  register: upgrade_unattended_timer_facts

- name: Assert apt-daily-upgrade timer is enabled
  ansible.builtin.assert:
    that:
      - upgrade_unattended_timer_facts.status.UnitFileState == "enabled"
    fail_msg: "apt-daily-upgrade.timer is not enabled"
