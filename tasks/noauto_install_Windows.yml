---
- name: Ensure we are on Windows
  ansible.builtin.fail:
    msg: "This role only supports Windows operating systems."
  when: ansible_os_family != "Windows"

- name: Install Windows Updates
  block:
    - name: Reset Windows Update components
      ansible.windows.win_powershell:
        script: |
          $services = @('wuauserv', 'cryptSvc', 'bits', 'msiserver')
          $services | ForEach-Object { Stop-Service -Name $_ -Force -ErrorAction SilentlyContinue }

          Remove-Item 'C:\Windows\SoftwareDistribution\Download' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'C:\Windows\System32\catroot2' -Recurse -Force -ErrorAction SilentlyContinue

          @('wuapi.dll', 'wups.dll', 'wups2.dll', 'qmgr.dll', 'qmgrprxy.dll') | ForEach-Object {
            & regsvr32.exe /s $_
          }

          $services | ForEach-Object { Start-Service -Name $_ -ErrorAction SilentlyContinue }
      become: true
      become_method: ansible.builtin.runas
      become_user: SYSTEM

    - name: Install Windows Updates via win_updates
      ansible.windows.win_updates:
        category_names: "{{ upgrade_windows_update_categories }}"
        state: installed
        # Reboot decisions are centralized in the role's handler so interactive
        # confirmation can run first; the module must not reboot on its own.
        reboot: false
        reboot_timeout: 1200
      register: windows_update_result
      notify: Reboot system
      retries: "{{ upgrade_windows_update_retries }}"
      delay: "{{ upgrade_windows_update_retry_delay }}"
      until: windows_update_result is not failed

    - name: Set reboot-required fact (Windows)
      ansible.builtin.set_fact:
        upgrade_reboot_required: "{{ windows_update_result.reboot_required | default(false) }}"

- name: Upgrade Chocolatey packages
  block:
    - name: Upgrade all Chocolatey packages
      chocolatey.chocolatey.win_chocolatey:
        name: all
        state: latest
      register: chocolatey_result
      notify: Reboot system
      become: true
      become_method: ansible.builtin.runas
      become_user: SYSTEM
