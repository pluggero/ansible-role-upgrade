---
- name: Ensure we are using pacman
  ansible.builtin.fail:
    msg: "This role only supports {{ ansible_os_family }} systems that use pacman as a package manager."
  when: ansible_pkg_mgr != "pacman"

- name: Install upgrade via pacman
  community.general.pacman:
    update_cache: true
    upgrade: true
  changed_when: false # The pacman module currently does not support cache_valid_time.
  become: true
  notify: Reboot system

# pacman replaces kernel package files in place, so the running kernel's
# module directory is removed in the same transaction that installs the new
# kernel — its absence reliably signals a reboot is needed.
- name: Check if running kernel's module directory still exists (Archlinux)
  ansible.builtin.stat:
    path: "/usr/lib/modules/{{ ansible_kernel }}"
  register: upgrade_reboot_required_check
  become: true

- name: Set reboot-required fact (Archlinux)
  ansible.builtin.set_fact:
    upgrade_reboot_required: "{{ not upgrade_reboot_required_check.stat.exists }}"
